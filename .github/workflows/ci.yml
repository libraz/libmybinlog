name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-gcc
            os: ubuntu-latest
            cc: gcc
            cxx: g++
          - name: linux-clang
            os: ubuntu-latest
            cc: clang
            cxx: clang++
          - name: macos
            os: macos-latest
            cc: clang
            cxx: clang++
          # zstd TRANSACTION_PAYLOAD events must report kUnsupported, not fail the build.
          - name: linux-gcc-no-zstd
            os: ubuntu-latest
            cc: gcc
            cxx: g++
            cmake_args: -DMYBINLOG_WITH_ZSTD=OFF
    steps:
      - uses: actions/checkout@v7

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y zlib1g-dev libzstd-dev pkg-config

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install zstd

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER=${{ matrix.cc }} -DCMAKE_CXX_COMPILER=${{ matrix.cxx }} ${{ matrix.cmake_args }}

      - name: Build
        run: cmake --build build -j 3

      - name: Test
        run: ctest --test-dir build --output-on-failure -j 3

  format-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-format zlib1g-dev

      - name: Check formatting
        run: git ls-files -z -- '*.h' '*.cpp' | xargs -0 clang-format --dry-run --Werror
